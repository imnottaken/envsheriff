name: envsheriff
description: Catch missing, unused and leaked environment variables
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Directory to check
    default: "."
  args:
    description: Extra CLI arguments, e.g. "--strict"
    default: ""
  version:
    description: envsheriff version from npm
    default: latest
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      env:
        ENVSHERIFF_PATH: ${{ inputs.path }}
        ENVSHERIFF_ARGS: ${{ inputs.args }}
        ENVSHERIFF_VERSION: ${{ inputs.version }}
      # shellcheck disable=SC2086 (args are intentionally word-split)
      run: npx --yes "envsheriff@${ENVSHERIFF_VERSION}" "$ENVSHERIFF_PATH" $ENVSHERIFF_ARGS
